<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal</title>
    <link rel="icon" href="m.ico" type="image/x-icon">
    <style>
        body {
            background-color: #282724;
            color: #1eff1a;
            font-family: monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden; /* Stops scrollbars on the body */
            height: 100vh;
            box-sizing: border-box;
        }
        #term {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents content inside the terminal from overflowing */
        }
    </style>
</head>
<body>
    <div id="term"></div>
    <script src="script.js"></script>
</body>
</html>
